 nap_coalition_peace_ENG:0 "Seek a Negotiated Coalition Settlement"
 nap_coalition_peace_ENG_desc:0 "Ask France for a bounded peace. France may refuse. A British settlement closes the whole coalition round; another participant can leave separately. No new borders are imposed."
 nap_coalition.200.t:0 "A Coalition Government Seeks Peace"
 nap_coalition.200.d:0 "The government of ENG has offered a limited settlement. Acceptance restores peace without annexation; refusal costs political capital and the war continues. Detailed alternate-winner terms remain a separate approved design task."
 nap_coalition_peace_HAB:0 "Seek a Negotiated Coalition Settlement"
