l_english:
 nap_coalition_council:0 "Coalition Diplomacy"
 nap_coalition_council_desc:0 "Membership is voluntary. Funding, separate peace and re-entry depend on the current round and resources. A coalition settlement is limited, not a license to annex defeated countries."
 nap_coalition_superseded:0 "The diplomatic situation has changed."
 nap_coalition_coordination:0 "Coalition Staff Coordination"
 nap_coalition_coordination_desc:0 "Shared planning arrangements improve staff work, but do not replace each government."
 nap_coalition_template_name:0 "Coalition Council"
 nap_coalition_manifest_name:0 "A Negotiated European Settlement"
 nap_coalition_manifest_desc:0 "This coalition seeks a bounded settlement. Its political and territorial terms are scripted, not a standard total-war partition."
 nap_coalition_1_name:0 "First Coalition"
 nap_coalition.1.t:0 "Organizing the First Coalition"
 nap_coalition.1.d:0 "The current French crisis permits a new coalition. Britain can organize a temporary alliance and invite the relevant governments. Invitations are not automatic declarations on their behalf. Existing unrelated factions are not replaced."
 nap_coalition.1.a:0 "Open the coalition council and commit Britain."
 nap_coalition.1.b:0 "Decline this round of commitments."
 nap_coalition.101.t:0 "Invitation to the First Coalition"
 nap_coalition.101.d:0 "Britain proposes joint action against France. Joining costs 8 treasury and commits us to the war, but retains a route to separate peace. Refusal does not create a war or transfer territory."
 nap_coalition.101.a:0 "Commit to this coalition."
 nap_coalition.101.b:0 "Remain outside the coalition."
