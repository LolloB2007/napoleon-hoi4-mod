 nap_coalition.201.t:0 "A Coalition Government Seeks Peace"
 nap_coalition.201.d:0 "The government of HAB has offered a limited settlement. Acceptance restores peace without annexation; refusal costs political capital and the war continues. Detailed alternate-winner terms remain a separate approved design task."
 nap_coalition_subsidy_HAB:0 "Subsidize HAB"
 nap_coalition_subsidy_HAB_desc:0 "Transfer exactly 15 treasury from Britain to this active coalition participant, reducing its exhaustion by 3. The recipient must have room below the treasury cap. This is a transfer, not newly created money."
