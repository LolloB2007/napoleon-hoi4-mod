l_english:
 nap_era_management:0 "State and Army Administration"
 nap_era_management_desc:0 "Treasury: [?nap_treasury|0] / Debt: [?nap_debt|0]\nLegitimacy: [?nap_legitimacy|0] / Fervor: [?nap_fervor|0]\nWar exhaustion: [?nap_war_exhaustion|0] / Army prestige: [?nap_army_prestige|0]\nReform: [?nap_reform|0] / Supply pressure: [?nap_supply_pressure|0]\nAll meters run from 0 to 100. These are game abstractions, not historical measurements."
 nap_treasury:0 "Treasury"
 nap_debt:0 "Debt"
 nap_legitimacy:0 "Legitimacy"
 nap_fervor:0 "Fervor"
 nap_war_exhaustion:0 "War Exhaustion"
 nap_army_prestige:0 "Army Prestige"
 nap_reform:0 "Reform"
 nap_supply_pressure:0 "Supply Pressure"
 nap_era_bonds:0 "Issue a Limited War Loan"
 nap_era_bonds_desc:0 "Borrow against future revenue. Treasury +25, debt +25, legitimacy -3. High debt drains the treasury each month."
 nap_era_repay:0 "Retire State Debt"
 nap_era_repay_desc:0 "Spend 20 treasury to retire 20 debt and restore 2 legitimacy."
 nap_era_audit:0 "Audit the Revenue Offices"
 nap_era_audit_desc:0 "Pay 10 treasury for an administrative audit: reform +5 and legitimacy +3."
 nap_era_recruit:0 "Recruit a Limited Volunteer Contingent"
 nap_era_recruit_desc:0 "Raise 5,000 volunteers at a cost of 12 treasury and 4 exhaustion. This does not change the conscription law."
 nap_era_levee:0 "Authorize an Emergency Levee"
 nap_era_levee_desc:0 "Mobilize 12,000 men. Treasury -20, fervor -10, exhaustion +12 and legitimacy -4. Available only to revolutionary France at war."
 nap_era_magazines:0 "Fund Forward Magazines"
 nap_era_magazines_desc:0 "Spend 15 treasury to reduce supply pressure by 12 and maintain temporary supply depots for 90 days."
 nap_era_rest:0 "Rotate Exhausted Formations"
 nap_era_rest_desc:0 "Exhaustion -8 at the cost of 10 treasury, 2 prestige and a temporary reduction in operational tempo."
 nap_era_requisition:0 "Authorize Local Requisitions"
 nap_era_requisition_desc:0 "Ease immediate supply pressure, but transfer the burden to civilians: treasury +10, supply pressure -6, exhaustion +8, legitimacy -5."
 nap_era_staff:0 "Expand the Staff College"
 nap_era_staff_desc:0 "Fund professional training: treasury -15, reform +6 and 10 army experience. The reform meter is capped at 100."
 nap_era_relief:0 "Relieve Distressed Communities"
 nap_era_relief_desc:0 "Spend 15 treasury to restore 6 legitimacy and remove 3 exhaustion."
 nap_era_demobilize:0 "Normalize the Peacetime Establishment"
 nap_era_demobilize_desc:0 "Reduce wartime administrative burdens after peace: exhaustion -10 and legitimacy +3. Does not delete divisions or duplicate manpower."
 nap_era_commissions:0 "Review Officer Commissions"
 nap_era_commissions_desc:0 "Promote demonstrated competence within the officer corps: treasury -10, national army prestige +6 and reform +2."
 nap_war_weariness:0 "War Weariness"
 nap_war_weariness_desc:0 "Exhaustion is impairing recruitment and field cohesion."
 nap_acute_exhaustion:0 "Acute War Exhaustion"
 nap_acute_exhaustion_desc:0 "A prolonged campaign has depleted public confidence and army cohesion."
 nap_legitimacy_crisis:0 "Legitimacy Crisis"
 nap_legitimacy_crisis_desc:0 "The government struggles to obtain compliance with its decisions."
 nap_secure_authority:0 "Secure Authority"
 nap_secure_authority_desc:0 "A broadly accepted administration can act more effectively."
 nap_debt_crisis:0 "Burden of State Debt"
 nap_debt_crisis_desc:0 "Debt service consumes fiscal capacity. Debt of 60 or more costs treasury each month."
 nap_extended_supply_lines:0 "Extended Supply Lines"
 nap_extended_supply_lines_desc:0 "Foreign occupations stretch magazines, roads and transport."
 nap_battle_confidence:0 "Confidence in the Army"
 nap_battle_confidence_desc:0 "Recent victories and institutional competence improve confidence."
 nap_shaken_army:0 "Shaken Army"
 nap_shaken_army_desc:0 "Military reverses have weakened confidence in the army."
 nap_staff_institutions:0 "Professional Staff Institutions"
 nap_staff_institutions_desc:0 "A sustained reform effort has improved staff work."
 nap_funded_magazines:0 "Funded Forward Magazines"
 nap_funded_magazines_desc:0 "Temporary, paid supply preparations ease a campaign."
 nap_army_rotation:0 "Rotating the Field Army"
 nap_army_rotation_desc:0 "Restoring exhausted formations reduces immediate operational tempo."
