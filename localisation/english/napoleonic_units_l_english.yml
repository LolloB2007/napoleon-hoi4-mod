l_english:
 # === Battalions ===
 line_infantry: "Line Infantry"
 line_infantry_desc: "Standard battalion of musket-armed regulars fighting in close order. The backbone of every Napoleonic army."
 light_infantry: "Light Infantry"
 light_infantry_desc: "Skirmishers and voltigeurs trained for loose-order aimed fire and terrain combat."
 grenadier: "Grenadiers"
 grenadier_desc: "Elite shock infantry — taller men, higher pay, the storm troops of the line."
 militia: "Militia"
 militia_desc: "Locally raised levies. Cheap, plentiful, brittle in the open but stubborn behind walls."
 guard_infantry: "Guard Infantry"
 guard_infantry_desc: "The Emperor's Old Guard. The finest soldiers in Europe — and the last reserve."

 light_cavalry: "Light Cavalry"
 light_cavalry_desc: "Hussars and chasseurs à cheval. Eyes and scourge of the army — reconnaissance, screening, pursuit."
 dragoon: "Dragoons"
 dragoon_desc: "Mounted infantry equally willing to fight on horse or on foot."
 heavy_cavalry: "Heavy Cavalry"
 heavy_cavalry_desc: "Cuirassiers and carabiniers in steel breastplates. The hammer of the battlefield."
 lancer: "Lancers"
 lancer_desc: "Uhlans wielding the lance — reach in the first impact, terror in the pursuit."
 irregular_cavalry: "Cossacks"
 irregular_cavalry_desc: "Steppe horsemen. Useless in line battle, devastating in raiding, scouting and the death-ride of routed armies."

 foot_artillery: "Foot Artillery"
 foot_artillery_desc: "The army's pride and the queen of battles. Slow to move, terrible in mass."
 horse_artillery: "Horse Artillery"
 horse_artillery_desc: "Crews mounted, gun teams swift — the elite arm able to keep pace with cavalry."
 siege_artillery: "Siege Artillery"
 siege_artillery_desc: "Heavy ordnance for reducing fortresses. Immobile in the field, devastating against walls."

 sapper_company: "Sapper Company"
 train_battalion: "Train Battalion"
 field_hospital: "Field Hospital"
 staff_company: "Staff Company"
 square_drill_company: "Square Drill Company"
 signal_corps: "Signal Corps"

