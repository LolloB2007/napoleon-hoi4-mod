l_english:
 nap_fra_revolutionary_crisis:0 "Revolutionary Government"
 nap_fra_revolutionary_crisis_desc:0 "Manage institutions, factional pressure, the Vendée, emergency finance and the Terror."
 nap_fra_napoleon_rise:0 "Bonaparte's Ascent"
 nap_fra_napoleon_rise_desc:0 "Turn military prestige into political authority through Italy, Egypt, Brumaire, the Consulate and Empire."
 nap_fra_continental_system:0 "The Continental System"
 nap_fra_continental_system_desc:0 "Enforce or relax the blockade and pressure European states while Britain adapts."
 nap_fra_peninsular_war:0 "The Peninsular War"
 nap_fra_peninsular_war_desc:0 "Manage occupation, guerrilla resistance, supply and the political cost of Iberian intervention."
 nap_fra_russian_campaign:0 "The Russian Campaign"
 nap_fra_russian_campaign_desc:0 "Prepare magazines and remounts, preserve cohesion and choose between settlement, retreat and disaster."
 nap_fra_restoration_cycle:0 "Collapse, Restoration and the Hundred Days"
 nap_fra_restoration_cycle_desc:0 "Control abdication, restoration, the return from Elba and the final European settlement."
 nap_continental_foreign:0 "Continental Customs"
 nap_continental_foreign_desc:0 "Comply with French customs enforcement or tolerate smuggling and British trade."
 nap_fra_vendee_revolt:0 "The Vendée in Revolt"
 nap_fra_vendee_revolt_desc:0 "Armed and political resistance in western France consumes troops, supplies and administrative attention."
 nap_fra_assignat_crisis:0 "Assignat Inflation"
 nap_fra_assignat_crisis_desc:0 "Emergency paper finance is undermining confidence and complicating government finance."
 nap_fra_committee_public_safety:0 "Committee of Public Safety"
 nap_fra_committee_public_safety_desc:0 "Emergency government concentrates authority at the cost of institutional restraint."
 nap_fra_consular_machine:0 "The Consular Machine"
 nap_fra_consular_machine_desc:0 "The Consulate has concentrated administration, finance and political decision-making."
 nap_fra_marshals_empire:0 "Marshals of the Empire"
 nap_fra_marshals_empire_desc:0 "A prestigious senior command cadre binds military advancement to the imperial state."
 nap_continental_compliance:0 "Continental Customs Enforcement"
 nap_continental_compliance_desc:0 "French customs pressure restricts commerce with Britain and creates domestic enforcement costs."
 nap_british_continental_pressure:0 "Continental Trade Pressure"
 nap_british_continental_pressure_desc:0 "A broad continental customs regime is obstructing British access to European markets."
 nap_fra_peninsular_guerrilla_war:0 "The Spanish Ulcer"
 nap_fra_peninsular_guerrilla_war_desc:0 "Guerrilla warfare and dispersed occupation duties consume supply and erode the political value of battlefield victories."
 nap_fra_russian_logistics:0 "Russian Campaign Logistics"
 nap_fra_russian_logistics_desc:0 "Distance, forage and transport losses are consuming the campaign faster than ordinary battlefield expenditure."
 nap_fra_russian_prepared:0 "Prepared Eastern Magazines"
 nap_fra_russian_prepared_desc:0 "Forward magazines, wagons and remounts give the army a temporary logistical reserve for the eastern campaign."
 nap_fra_hundred_days_mobilization:0 "Hundred Days Mobilization"
 nap_fra_hundred_days_mobilization_desc:0 "Veterans and loyal formations have rallied quickly, but the restored imperial state remains politically fragile."
 nap_fra_restoration_charter:0 "Charter of the Restoration"
 nap_fra_restoration_charter_desc:0 "The restored monarchy has accepted a bounded constitutional settlement rather than trying to erase the Revolution wholesale."
 nap_fra_postwar_exhaustion:0 "Postwar Exhaustion"
 nap_fra_postwar_exhaustion_desc:0 "France must absorb demobilisation, debt, veterans and political disappointment after prolonged war."
 nap_fra_establish_national_assembly:0 "Assert the National Assembly"
 nap_fra_establish_national_assembly_desc:0 "Turn the Estates-General into a permanent national legislature. Reform +3, legitimacy +3, faction tension +5."
 nap_fra_legislative_assembly:0 "Reconstitute the Legislative Assembly"
 nap_fra_legislative_assembly_desc:0 "Translate the revolutionary settlement into a legislature capable of governing rather than merely declaring principles."
 nap_fra_national_convention:0 "Convene the National Convention"
 nap_fra_national_convention_desc:0 "Replace the earlier assemblies with a republican convention. Revolutionary fervor rises, but so does factional tension."
 nap_fra_support_girondins:0 "Support the Girondin Clubs"
 nap_fra_support_girondins_desc:0 "Strengthen decentralising republican deputies. Girondin influence +10, legitimacy +2, faction tension +4."
 nap_fra_support_jacobins:0 "Mobilize the Jacobin Clubs"
 nap_fra_support_jacobins_desc:0 "Strengthen the radical clubs. Jacobin influence +10, fervor +3, legitimacy -1, faction tension +5."
 nap_fra_issue_assignats:0 "Issue a New Assignat Tranche"
 nap_fra_issue_assignats_desc:0 "Create immediate fiscal room at the cost of debt, legitimacy and accumulating inflation. Treasury +18, debt +8, assignat inflation +12."
 nap_fra_redeem_assignats:0 "Redeem Assignats from Circulation"
 nap_fra_redeem_assignats_desc:0 "Spend treasury to reduce paper-money pressure. Treasury -15, debt -5, legitimacy +2, assignat inflation -15."
 nap_fra_negotiate_vendee:0 "Negotiate with Refractory Parishes"
 nap_fra_negotiate_vendee_desc:0 "Use concessions, local intermediaries and relief to lower Vendée unrest by 15 at a fiscal and revolutionary-political cost."
 nap_fra_columns_vendee:0 "Dispatch Republican Columns to the West"
 nap_fra_columns_vendee_desc:0 "Suppress unrest by force. Vendée unrest -20, but exhaustion rises and legitimacy falls."
 nap_fra_committee_public_safety:0 "Establish the Committee of Public Safety"
 nap_fra_committee_public_safety_desc:0 "Create an emergency executive for war and internal crisis. It raises fervor and central capacity but intensifies factional tension."
 nap_fra_debate_terror:0 "Debate Emergency Terror"
 nap_fra_debate_terror_desc:0 "Put the Committee emergency programme before the Convention. The existing Terror event resolves whether the government embraces or restrains it."
 nap_fra_thermidorian_reaction:0 "Trigger a Thermidorian Reaction"
 nap_fra_thermidorian_reaction_desc:0 "When factional tension or war exhaustion becomes severe, break the emergency regime and return authority to the Convention."
 nap_fra_install_directory:0 "Establish the Executive Directory"
 nap_fra_install_directory_desc:0 "Replace the post-Thermidor Convention with the Executive Directory through the existing guarded transition event."
 nap_fra_open_italian_campaign:0 "Organize the Army of Italy"
 nap_fra_open_italian_campaign_desc:0 "Give Bonaparte an operational command, forward magazines and a political mandate. This starts the decision-driven Italian campaign."
 nap_fra_italian_requisitions:0 "Requisition Italian Magazines"
 nap_fra_italian_requisitions_desc:0 "Live partly off the theatre. Treasury +8 and supply pressure -5, at a legitimacy cost; Napoleon prestige +3."
 nap_fra_italian_republics:0 "Court the Italian Patriots"
 nap_fra_italian_republics_desc:0 "Use republican clients and political theatre to convert campaigning into personal and revolutionary prestige."
 nap_fra_conclude_italian_campaign:0 "Conclude the Italian Campaign"
 nap_fra_conclude_italian_campaign_desc:0 "Convert battlefield reputation into a durable political fact. Requires Napoleon prestige 35; marks the Italian campaign successfully concluded."
 nap_fra_prepare_egypt:0 "Prepare the Egyptian Expedition"
 nap_fra_prepare_egypt_desc:0 "Commit money, shipping and political capital to Egypt. The expedition begins with substantial supply pressure."
 nap_fra_institute_egypt:0 "Found the Institut d’Égypte"
 nap_fra_institute_egypt_desc:0 "Use scholarship, surveys and administration to turn expeditionary prestige into reform and political capital."
 nap_fra_egypt_supply:0 "Secure Mediterranean Supply"
 nap_fra_egypt_supply_desc:0 "Spend treasury on shipping, depots and replacement stores. Supply pressure -10, Napoleon prestige +2."
 nap_fra_return_egypt:0 "Return from Egypt"
 nap_fra_return_egypt_desc:0 "End the expedition before its logistical burden becomes politically ruinous. Requires supply pressure no higher than 70."
 nap_fra_stage_brumaire:0 "Stage the Coup of Brumaire"
 nap_fra_stage_brumaire_desc:0 "Use military prestige to break the Directory. Requires Napoleon prestige 45 and a concluded Egyptian expedition."
 nap_fra_constitution_year_viii:0 "Consolidate the Constitution of Year VIII"
 nap_fra_constitution_year_viii_desc:0 "Build the administrative state behind the Consulate. Reform +5, legitimacy +5 and a permanent Consular Machine spirit."
 nap_fra_proclaim_empire_decision:0 "Submit the Empire to Plebiscitary Legitimacy"
 nap_fra_proclaim_empire_decision_desc:0 "Convert the Consulate into the Empire through the existing guarded proclamation event. Requires Napoleon prestige 60."
 nap_fra_coronation:0 "Hold the Imperial Coronation"
 nap_fra_coronation_desc:0 "Stage the coronation as a deliberate act of regime consolidation instead of waiting for a fixed delayed event."
 nap_fra_appoint_marshals:0 "Create the Marshals of the Empire"
 nap_fra_appoint_marshals_desc:0 "Institutionalize a senior imperial command cadre. Army prestige +8, Napoleon prestige +10 and a permanent Marshals spirit."
 nap_fra_activate_continental_system:0 "Issue the Continental Decrees"
 nap_fra_activate_continental_system_desc:0 "Activate the Continental System through the existing event, then manage compliance through recurring diplomatic pressure."
 nap_fra_continental_pressure_rus:0 "Pressure Russia to Enforce the Blockade"
 nap_fra_continental_pressure_rus_desc:0 "Spend diplomatic and fiscal capital to impose 180 days of Continental customs enforcement. This raises accumulated pressure on British trade."
 nap_fra_continental_pressure_pru:0 "Pressure Prussia to Enforce the Blockade"
 nap_fra_continental_pressure_pru_desc:0 "Spend diplomatic and fiscal capital to impose 180 days of Continental customs enforcement. This raises accumulated pressure on British trade."
 nap_fra_continental_pressure_hab:0 "Pressure Austria to Enforce the Blockade"
 nap_fra_continental_pressure_hab_desc:0 "Spend diplomatic and fiscal capital to impose 180 days of Continental customs enforcement. This raises accumulated pressure on British trade."
 nap_fra_continental_pressure_spr:0 "Pressure Spain to Enforce the Blockade"
 nap_fra_continental_pressure_spr_desc:0 "Spend diplomatic and fiscal capital to impose 180 days of Continental customs enforcement. This raises accumulated pressure on British trade."
 nap_fra_continental_pressure_por:0 "Pressure Portugal to Enforce the Blockade"
 nap_fra_continental_pressure_por_desc:0 "Spend diplomatic and fiscal capital to impose 180 days of Continental customs enforcement. This raises accumulated pressure on British trade."
 nap_fra_continental_pressure_net:0 "Pressure the Netherlands to Enforce the Blockade"
 nap_fra_continental_pressure_net_desc:0 "Spend diplomatic and fiscal capital to impose 180 days of Continental customs enforcement. This raises accumulated pressure on British trade."
 nap_fra_continental_pressure_den:0 "Pressure Denmark to Enforce the Blockade"
 nap_fra_continental_pressure_den_desc:0 "Spend diplomatic and fiscal capital to impose 180 days of Continental customs enforcement. This raises accumulated pressure on British trade."
 nap_fra_continental_pressure_swe:0 "Pressure Sweden to Enforce the Blockade"
 nap_fra_continental_pressure_swe_desc:0 "Spend diplomatic and fiscal capital to impose 180 days of Continental customs enforcement. This raises accumulated pressure on British trade."
 nap_fra_tighten_continental_customs:0 "Tighten Continental Customs"
 nap_fra_tighten_continental_customs_desc:0 "Increase inspections and customs enforcement. Treasury -10, legitimacy -2, Continental pressure +10."
 nap_fra_relax_continental_customs:0 "Permit Licensed Continental Trade"
 nap_fra_relax_continental_customs_desc:0 "Ease enforcement to reduce domestic and allied friction. Legitimacy +3, Continental pressure -12."
 nap_continental_evade_customs:0 "Tolerate Smuggling through the Blockade"
 nap_continental_evade_customs_desc:0 "End formal compliance early, gain political room and reduce French Continental pressure. Britain benefits from the breach."
 nap_continental_enforce_locally:0 "Enforce the French Customs Regime"
 nap_continental_enforce_locally_desc:0 "Accept the domestic enforcement cost of the blockade, strengthening French Continental pressure while marginally stabilizing policy."
 nap_fra_launch_peninsular_intervention:0 "Intervene in Iberia"
 nap_fra_launch_peninsular_intervention_desc:0 "Begin the Peninsular War through a decision rather than the focus automatically declaring war. Resistance starts at 35 and immediately burdens French supply."
 nap_fra_peninsular_depots:0 "Fortify the Iberian Depots"
 nap_fra_peninsular_depots_desc:0 "Spend 12 treasury to reduce supply pressure and make isolated garrisons less vulnerable. Resistance -4."
 nap_fra_peninsular_conciliate:0 "Conciliate Spanish Elites"
 nap_fra_peninsular_conciliate_desc:0 "Spend political capital on municipal, clerical and elite accommodation. Resistance -12 and legitimacy +3."
 nap_fra_peninsular_columns:0 "Deploy Mobile Counter-Guerrilla Columns"
 nap_fra_peninsular_columns_desc:0 "Reduce resistance by force at the cost of exhaustion and legitimacy. Resistance -18, exhaustion +5, legitimacy -5."
 nap_fra_peninsular_rotate:0 "Rotate the Occupation Army"
 nap_fra_peninsular_rotate_desc:0 "Trade operational tempo and prestige for lower war exhaustion among dispersed garrisons."
 nap_fra_peninsular_settlement:0 "Impose a Bounded Iberian Settlement"
 nap_fra_peninsular_settlement_desc:0 "When resistance has been reduced below 25 and Napoleon prestige is at least 55, end the Iberian war without annexing Spain or Portugal."
 nap_fra_peninsular_withdraw:0 "Abandon the Deep Iberian Occupation"
 nap_fra_peninsular_withdraw_desc:0 "Cut losses when resistance or exhaustion becomes intolerable. The war ends without annexation, but prestige and legitimacy suffer."
 nap_fra_russia_magazines:0 "Build Polish Forward Magazines"
 nap_fra_russia_magazines_desc:0 "Spend 15 treasury to raise Russian-campaign supply preparation by 20."
 nap_fra_russia_remounts:0 "Accumulate Remounts and Wagons"
 nap_fra_russia_remounts_desc:0 "Prepare horses, wagons and replacement transport. Supply preparation +12, cohesion +5."
 nap_fra_russia_allies:0 "Coordinate Allied Contingents"
 nap_fra_russia_allies_desc:0 "Spend political capital coordinating client and allied contingents. Supply preparation +8, cohesion +8."
 nap_fra_russia_launch:0 "Cross the Niemen"
 nap_fra_russia_launch_desc:0 "Open the Russian campaign council once supply preparation reaches 45. The guarded invasion event still lets France abandon the invasion at the final moment."
 nap_fra_russia_forward_depots:0 "Establish Forward Depots"
 nap_fra_russia_forward_depots_desc:0 "Spend 15 treasury to restore 20 campaign supply and 5 cohesion while reducing national supply pressure."
 nap_fra_russia_winter_quarters:0 "Halt for Winter Quarters"
 nap_fra_russia_winter_quarters_desc:0 "Recover supply and cohesion at the cost of operational prestige. Supply +10, cohesion +15, army prestige -4."
 nap_fra_russia_press_on:0 "Press Deeper into Russia"
 nap_fra_russia_press_on_desc:0 "Trade logistical safety for prestige and operational momentum. Supply -20, cohesion -10, Napoleon prestige +8."
 nap_fra_russia_settlement:0 "Offer Russia a Continental Settlement"
 nap_fra_russia_settlement_desc:0 "A successful campaign can end through a bounded Tilsit-style settlement instead of a scripted French disaster. Requires supply/cohesion 40 and Napoleon prestige 65."
 nap_fra_russia_retreat:0 "Order an Organized Retreat"
 nap_fra_russia_retreat_desc:0 "Withdraw before the army collapses. The war ends without territorial gain, but this avoids automatically destroying the Grande Armée."
 nap_fra_fontainebleau:0 "Convene the Fontainebleau Abdication Council"
 nap_fra_fontainebleau_desc:0 "When the imperial war position becomes untenable, open the guarded abdication event. France may still choose to fight on."
 nap_fra_restore_bourbons:0 "Restore Louis XVIII"
 nap_fra_restore_bourbons_desc:0 "Complete the first Restoration deliberately after abdication rather than through a fixed delay."
 nap_fra_restoration_charter:0 "Grant a Constitutional Charter"
 nap_fra_restoration_charter_desc:0 "Bind the restored monarchy to a limited post-revolutionary settlement. Legitimacy +6, reform +3 and a permanent Charter spirit."
 nap_fra_return_elba:0 "Return from Elba"
 nap_fra_return_elba_desc:0 "Trigger the Hundred Days through the guarded return event when the restoration and focus conditions are present."
 nap_fra_hundred_days_rally:0 "Rally the Veterans of the Empire"
 nap_fra_hundred_days_rally_desc:0 "Rebuild an army quickly around veterans and loyal cadres. Army prestige +6 and a mobilization spirit, but exhaustion rises."
 nap_fra_hundred_days_liberal:0 "Issue an Additional Act"
 nap_fra_hundred_days_liberal_desc:0 "Trade some imperial personal authority for constitutional support. Legitimacy +6, reform +4, Napoleon prestige -3."
 nap_fra_hundred_days_battle:0 "Seek a Decisive Battle in Belgium"
 nap_fra_hundred_days_battle_desc:0 "Risk the restored Empire on a decisive campaign. This invokes the guarded Waterloo outcome event rather than firing it after a fixed 109-day timer."
 nap_fra_second_abdication:0 "Accept the Second Abdication"
 nap_fra_second_abdication_desc:0 "After Waterloo, complete Napoleon’s second abdication and restore the Bourbons through the existing guarded event."
 nap_fra_hundred_days_survive:0 "Consolidate a Surviving Hundred Days Regime"
 nap_fra_hundred_days_survive_desc:0 "If France reaches peace without Waterloo, convert the emergency return into a durable liberal-imperial settlement instead of forcing historical defeat."
 nap_fra_concert:0 "Accept the European Postwar Settlement"
 nap_fra_concert_desc:0 "At peace after the Restoration or a surviving Hundred Days regime, close the campaign cycle with a deliberate postwar settlement and demobilisation burden."
 nap_fra_metric_vendee:0 "Vendée Unrest"
 nap_fra_metric_assignats:0 "Assignat Inflation"
 nap_fra_metric_factions:0 "Faction Tension"
 nap_fra_metric_prestige:0 "Napoleon Prestige"
 nap_fra_metric_continental:0 "Continental Pressure"
 nap_fra_metric_peninsula:0 "Peninsular Resistance"
 nap_fra_metric_russia_supply:0 "Russian Campaign Supply"
 nap_fra_metric_russia_cohesion:0 "Russian Campaign Cohesion"
