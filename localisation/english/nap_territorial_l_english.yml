 nap_client_aid_BAT:0 "Support the Administration of Batavian Republic"
 nap_client_aid_BAT_desc:0 "Transfer 12 treasury to this existing French client. Its legitimacy and administrative reform each improve by 2. This does not create a subject, change borders, or annex a client."
