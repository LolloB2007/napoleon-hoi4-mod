 nap_integrate_savoy_735:0 "Integrate Savoy: State 735"
 nap_integrate_savoy_735_desc:0 "An approved, paid 180-day programme. France must retain ownership and control, remain at peace, keep compliance at least 80, and resistance at most 10. Losing these conditions cancels the programme without a core. The 20 treasury investment is not refunded."
 nap_integrate_austrian_netherlands_6:0 "Integrate Austrian Netherlands (draft map abstraction): State 6"
 nap_integrate_austrian_netherlands_6_desc:0 "An approved, paid 270-day programme. France must retain ownership and control, remain at peace, keep compliance at least 85, and resistance at most 10. Losing these conditions cancels the programme without a core. The 25 treasury investment is not refunded."
 nap_form_italian_kingdom:0 "Proclaim Kingdom of Italy"
 nap_form_italian_kingdom_desc:0 "This approved formation requires independent, peaceful ownership and control of its required state set. On proclamation it grants cores on the explicitly audited core-state set associated with the formable, while preserving the original country tag, leaders and focus tree and annexing no country."
