l_english:
 nap_territorial_council:0 "Territorial and Client Administration"
 nap_territorial_council_desc:0 "Restore countries only from existing cores, support existing clients, or carry out explicitly approved integration programmes. Pending territorial proposals are not enabled in the game."
 nap_client_offer.t:0 "A Proposed Rhine Client Charter"
 nap_client_offer.d:0 "France offers membership of its dependent-state network. Acceptance makes this state a French subject under the existing client design. Refusal preserves independence and imposes no territorial transfer. Neither option can replace an unrelated faction or an existing overlord."
 nap_client_offer.a:0 "Accept the dependent-state charter."
 nap_client_offer.b:0 "Retain our present independence."
 nap_restore_SPR:0 "Restore Spain"
 nap_restore_SPR_desc:0 "Release this country as independent using only its existing cores that we own. It must not already exist, and its releasable states must be under our control while we are at peace. Costs 12 treasury after a successful release. No cores are invented and no third-party land is transferred."
