l_english:
 nap_flavour.1.t:0 "The Pamphlet Stalls of Paris"
 nap_flavour.1.d:0 "Printers and booksellers can barely keep pace with the appetite for political argument. Pamphlets pass from hand to hand before the ink is dry."
 nap_flavour.1.a:0 "Public opinion has become a force of its own."
 nap_flavour.2.t:0 "Coffee-House Politics"
 nap_flavour.2.d:0 "Merchants, MPs and pamphleteers crowd London's coffee houses, turning war, credit and reform into arguments that last well after midnight."
 nap_flavour.2.a:0 "The kingdom debates in public."
 nap_flavour.3.t:0 "A Court of Many Languages"
 nap_flavour.3.d:0 "Petitions reach Vienna in German, Hungarian, Czech, Italian and the languages of the southern crownlands. Reform must travel through an empire of many political traditions."
 nap_flavour.3.a:0 "Administration is diplomacy at home."
 nap_flavour.4.t:0 "The Memory of Old Fritz"
 nap_flavour.4.d:0 "Every drill field still lives in the shadow of Frederick the Great. The question is whether imitation preserves his achievement or merely preserves his habits."
 nap_flavour.4.a:0 "Tradition can inspire or imprison."
 nap_flavour.5.t:0 "Winter at the Imperial Court"
 nap_flavour.5.d:0 "Behind the brilliance of the court lies a state spanning distances that turn every order into a logistical problem."
 nap_flavour.5.a:0 "The empire is larger than its roads."
 nap_flavour.6.t:0 "The Cádiz Merchants"
 nap_flavour.6.d:0 "Atlantic merchants petition the crown for security, predictable customs and protection from disruptions that can empty warehouses in a season."
 nap_flavour.6.a:0 "The Atlantic monarchy depends on commerce."
 nap_flavour.7.t:0 "The Sejm in Session"
 nap_flavour.7.d:0 "Deputies argue over sovereignty, taxation and the survival of the Commonwealth while neighbouring courts follow every speech with interest."
 nap_flavour.7.a:0 "Reform has become a question of survival."
 nap_flavour.8.t:0 "Stockholm's Political Stage"
 nap_flavour.8.d:0 "Court, officers and estates all understand that Gustavian politics is performed before an attentive public as much as decided behind palace doors."
 nap_flavour.8.a:0 "Every gesture acquires political meaning."
 nap_flavour.9.t:0 "Reports from the European Embassies"
 nap_flavour.9.d:0 "Envoys return with translated drill manuals, diplomatic memoranda and uncomfortable comparisons. The Porte must decide what can be borrowed without surrendering authority."
 nap_flavour.9.a:0 "Knowledge itself becomes political."
 nap_flavour.10.t:0 "An Evening on the Riva"
 nap_flavour.10.d:0 "Merchants and patricians watch ships enter the lagoon beneath the old symbols of the Republic, wondering how long neutrality can insulate Venice from continental upheaval."
 nap_flavour.10.a:0 "The Serenissima measures the changing wind."
 nap_flavour.11.t:0 "The Lisbon Waterfront"
 nap_flavour.11.d:0 "Convoys, naval stores and colonial correspondence crowd the quays. Portugal's security remains inseparable from the Atlantic."
 nap_flavour.11.a:0 "The sea is the kingdom's strategic depth."
 nap_flavour.12.t:0 "The First Cabinet Debates"
 nap_flavour.12.d:0 "The new federal government is still inventing the habits by which constitutional language becomes everyday administration."
 nap_flavour.12.a:0 "A republic becomes a government."
