name: Build mod content
on:
  push:
    branches: ['dev/**']
  pull_request:
permissions:
  contents: read
env:
  PYTHONDONTWRITEBYTECODE: '1'
concurrency:
  group: content-${{ github.ref }}
  cancel-in-progress: false
jobs:
  generate:
    if: github.event_name == 'push' && github.event.created == false
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Generate engine files
        run: |
          if [ -f tools/build_content.py ]; then python3 tools/build_content.py; fi
      - name: Unit tests
        run: |
          if [ -d tests ]; then python3 -m unittest discover -s tests -v; fi
      - name: Commit generated game files to this development branch only
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os, re, subprocess
          from pathlib import Path
          branch = os.environ['TARGET_BRANCH']
          if not re.fullmatch(r'dev/[A-Za-z0-9_./-]+', branch):
              raise SystemExit('Refusing to write outside dev/ branches')
          roots = ['common','history','events','localisation','interface','gfx','sound','music','docs']
          roots += ['README.md','ROADMAP.md','to ask lollo.md','suggestions.md']
          paths = [p for p in roots if Path(p).exists()]
          if paths:
              subprocess.run(['git','add','-A','--',*paths], check=True)
          if subprocess.run(['git','diff','--cached','--quiet']).returncode == 0:
              raise SystemExit(0)
          subprocess.run(['git','config','user.name','github-actions[bot]'], check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'], check=True)
          subprocess.run(['git','commit','-m','build: regenerate checked-in mod content'], check=True)
          subprocess.run(['git','push','origin',f'HEAD:{branch}'], check=True)
          PY
  verify:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify generated files are current
        run: |
          if [ -f tools/build_content.py ]; then python3 tools/build_content.py --check; fi
      - name: Unit tests
        run: |
          if [ -d tests ]; then python3 -m unittest discover -s tests -v; fi
